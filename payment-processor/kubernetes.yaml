apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: payment-processor
  name: payment-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-processor
  template:
    metadata:
      labels:
        app: payment-processor
    spec:
      containers:
        - name: payment-processor
          image: quay.io/avillega/patient-portal-payment-processor:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: COUNTRY_CODE
              value: "ES"
