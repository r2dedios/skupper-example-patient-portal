---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend
    partner: exate
  name: frontend-exate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      partner: exate
  template:
    metadata:
      labels:
        app: frontend
        partner: exate
    spec:
      containers:
        - name: frontend
          image: quay.io/avillega/patient-portal-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_SERVICE_HOST
              value: "database"
            - name: DATABASE_SERVICE_PORT
              value: "5432"
            - name: PAYMENT_PROCESSOR_SERVICE_HOST
              value: "hub"
            - name: PAYMENT_PROCESSOR_SERVICE_PORT
              value: "8000"
            - name: APIGATOR_HOST
              value: "https://gateway-gravitee-apim.apps.exate-alpha.azure.sandboxedcontainers.com/api/data"

---
kind: Service
apiVersion: v1
metadata:
  name: frontend-exate
spec:
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
  internalTrafficPolicy: Cluster
  selector:
    app: frontend
    partner: exate

---
kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: frontend-exate
  namespace: skupper-patient-portal-public
spec:
  host: frontend-exate-skupper-patient-portal-public.apps.exate-alpha.azure.sandboxedcontainers.com
  path: /
  to:
    kind: Service
    name: frontend-exate
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
  wildcardPolicy: None
